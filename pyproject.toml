[project]
name = "t2greps"
version = "0.1.0"
description = "T2 (and T1, amplitude) mapping from gradient echo with partial RF spoiling (GREPS)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Laurin Mordhorst", email = "laurin.mordhorst@gmx.de"},
]
dependencies = [
    "numpy>=1.24",
    "numba>=0.59",
    "nibabel>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
t2greps-fit = "t2greps.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
